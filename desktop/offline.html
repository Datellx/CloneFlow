<!doctype html><html><head><meta charset="utf-8"><title>Clone Flow</title>
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fbf7f6;color:#2a1418}
  .w{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px}
  h1{font-weight:500;font-size:22px;margin:8px 0 0}
  p{color:#6b5a5e;margin:0;max-width:420px;line-height:1.5}
  button{margin-top:10px;background:#7A1E3A;color:#fff;border:0;border-radius:999px;padding:10px 22px;font-size:14px;cursor:pointer}
  input{width:320px;padding:9px 12px;border:1px solid #e5d6d9;border-radius:10px;font-size:13px}
  .s{font-size:12px;color:#9a888c}
</style></head><body><div class="w">
  <img src="build/icon.png" width="64" height="64" alt="">
  <h1>Can't reach Clone Flow</h1>
  <p>Check your internet connection. If your organization uses its own Clone Flow address, enter it below.</p>
  <input id="u" spellcheck="false"><button id="b">Try again</button>
  <span class="s" id="s"></span>
</div><script>
  (async () => {
    const u = document.getElementById("u");
    u.value = await window.cloneflowApp.server();
    document.getElementById("b").onclick = async () => {
      document.getElementById("s").textContent = "Connecting…";
      await window.cloneflowApp.setServer(u.value.trim());
      await window.cloneflowApp.retry();
    };
  })();
</script></body></html>
